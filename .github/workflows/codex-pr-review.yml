name: Codex PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build review diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git diff --unified=80 --no-ext-diff --find-renames "origin/${BASE_REF}...HEAD" > pr.diff
          head -c 120000 pr.diff > pr-review.diff

      - name: Request Codex review
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5-mini' }}
        with:
          script: |
            const fs = require("fs");

            if (!process.env.OPENAI_API_KEY) {
              core.setFailed("Missing OPENAI_API_KEY repository secret.");
              return;
            }

            const diff = fs.readFileSync("pr-review.diff", "utf8").trim();
            if (!diff) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "Codex PR Review: no reviewable diff found."
              });
              return;
            }

            const prompt = [
              "Review this GitHub pull request diff as a senior engineer.",
              "Focus on correctness, security, reliability, data loss, regressions, and missing tests.",
              "Return concise Markdown with:",
              "1. Findings ordered by severity, each with file path and line context when visible.",
              "2. Questions or assumptions.",
              "3. A short final verdict: approve, comment, or request changes.",
              "Avoid broad style feedback unless it hides a real bug.",
              "",
              "Pull request:",
              `Title: ${context.payload.pull_request.title}`,
              `Author: ${context.payload.pull_request.user.login}`,
              "",
              "Diff:",
              diff
            ].join("\n");

            const response = await fetch("https://api.openai.com/v1/responses", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                model: process.env.OPENAI_MODEL,
                input: [
                  {
                    role: "system",
                    content: "You are Codex, an expert code reviewer. Be precise, practical, and evidence-based."
                  },
                  {
                    role: "user",
                    content: prompt
                  }
                ],
                max_output_tokens: 2500
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`OpenAI review request failed: ${response.status} ${errorText}`);
              return;
            }

            const result = await response.json();
            const reviewText = result.output_text
              || result.output?.flatMap((item) => item.content || [])
                .filter((content) => content.type === "output_text")
                .map((content) => content.text)
                .join("\n\n")
              || "Codex PR Review: no review text was returned.";
            const truncatedNotice = fs.statSync("pr.diff").size > fs.statSync("pr-review.diff").size
              ? "\n\n_Note: The diff was truncated to keep the review request within size limits._"
              : "";
            const marker = "<!-- codex-pr-review -->";
            const body = `${marker}\n## Codex PR Review\n\n${reviewText}${truncatedNotice}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const previousComment = comments.find((comment) =>
              comment.user.type === "Bot" && comment.body?.includes(marker)
            );

            if (previousComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previousComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
